<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docket: Roll Call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700;6..72,800&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;color:#000000}
a{color:#000000}a:hover{color:#333333}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 52px 16px 34px; gap: 18px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; border-bottom: 1px solid #E4E4E7; margin: 0 -16px; padding: 0 8px 8px">
    <a href="Main.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 700">Roll Call</span>
    <a href="#help" aria-label="How to play" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6"></path><circle cx="12" cy="17" r="0.6" fill="#000000"></circle></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
    <p style="margin: 0; font-size: 14px; color: #5A5A5E">{{progressLabel}}</p>
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <sc-for list="{{dots}}" as="dot" hint-placeholder-count="5">
        <span style="{{dot.style}}"></span>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{voting}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
      <div style="position: relative; height: 330px">
        <div style="position: absolute; left: 14px; right: 14px; top: 20px; height: 300px; border-radius: 14px; background: #FFFFFF; border: 2px solid #000000"></div>
        <div style="position: absolute; left: 7px; right: 7px; top: 10px; height: 300px; border-radius: 14px; background: #FFFFFF; border: 2px solid #000000"></div>
        <article style="position: absolute; left: 0; right: 0; top: 0; height: 300px; box-sizing: border-box; padding: 22px; border-radius: 14px; background: #FFFFFF; border: 2px solid #000000; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="padding: 3px 10px; border-radius: 999px; background: {{bill.chipBg}}; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">{{bill.number}}</span>
            <span style="font-size: 13px; color: #5A5A5E">{{bill.chamber}}</span>
          </div>
          <h2 style="margin: 4px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 30px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px">{{bill.title}}</h2>
          <p style="margin: 0; font-size: 15px; line-height: 21px; color: #3A3A3C">{{bill.summary}}</p>
          <div style="flex: 1"></div>
          <a href="#read" style="align-self: flex-start; font-size: 15px; font-weight: 600; text-underline-offset: 3px">Read the bill</a>
        </article>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px">
        <button type="button" onClick="{{voteNay}}" style="flex: 1; height: 54px; border-radius: 999px; border: 2px solid #000000; background: #FFFFFF; color: #000000; font-size: 18px; font-weight: 700; cursor: pointer">Nay</button>
        <button type="button" onClick="{{voteYea}}" style="flex: 1; height: 54px; border-radius: 999px; border: 2px solid #000000; background: #000000; color: #FFFFFF; font-size: 18px; font-weight: 700; cursor: pointer">Yea</button>
      </div>
      <p style="margin: 0; text-align: center; font-size: 13px; color: #5A5A5E">Or swipe the card right for Yea, left for Nay</p>
    </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; padding: 0 20px">
      <svg width="72" height="72" viewBox="0 0 58 58" aria-hidden="true"><rect x="9" y="6" width="40" height="46" rx="5" fill="#C9D0F5" stroke="#000000" stroke-width="3"></rect><path d="M19 29l7 7 14-15" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; line-height: 38px; font-weight: 700">Your votes are in</h2>
      <p style="margin: 0; font-size: 17px; line-height: 23px; color: #3A3A3C">See what happened to each bill and how your friends and lawmakers voted.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
      <a href="RollCallResults.dc.html" style="width: 100%; height: 54px; border-radius: 999px; background: #000000; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">See results</a>
      <button type="button" onClick="{{restart}}" style="height: 44px; padding: 0 16px; border: none; background: transparent; color: #000000; font-size: 16px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Vote again</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { index: 0 };
  }
  renderVals() {
    var bills = [
      { number: 'HB 1481', chamber: 'Texas House, 2025', chipBg: '#C9D0F5', title: 'Ban personal phones in public school classrooms', summary: 'Students would keep phones and other personal devices put away during the school day.' },
      { number: 'S. 146', chamber: 'U.S. Congress, 2025', chipBg: '#F8D08A', title: 'Make sites remove nonconsensual intimate images, including deepfakes', summary: 'The TAKE IT DOWN Act. Platforms would have to take reported images down within 48 hours.' },
      { number: 'SB 3', chamber: 'Texas Senate, 2025', chipBg: '#C9D0F5', title: 'Ban hemp-derived THC products in Texas', summary: 'Stores could no longer sell hemp products that contain THC.' },
      { number: 'S. 5', chamber: 'U.S. Congress, 2025', chipBg: '#F8D08A', title: 'Detain undocumented immigrants charged with theft', summary: 'The Laken Riley Act. Federal immigration officials would have to hold them in custody.' },
      { number: 'C14-2026-0020', chamber: 'Austin City Council, 2026', chipBg: '#A8DDD5', title: 'Let shops and restaurants open at 37th and Speedway', summary: 'Rezone three lots near campus, in your ZIP code, from limited office to neighborhood commercial.' }
    ];
    var i = this.state.index;
    var self = this;
    var next = function () { self.setState({ index: Math.min(i + 1, bills.length) }); };
    var tile = 'width: 22px; height: 22px; border-radius: 4px; box-sizing: border-box; ';
    return {
      voting: i < bills.length,
      done: i >= bills.length,
      bill: bills[Math.min(i, bills.length - 1)],
      progressLabel: i < bills.length ? 'Bill ' + (i + 1) + ' of 5' : 'All 5 voted',
      dots: bills.map(function (_, d) {
        return { style: tile + (d < i ? 'background: #000000; border: 2px solid #000000' : d === i ? 'background: #C9D0F5; border: 2px solid #000000' : 'background: #FFFFFF; border: 2px solid #D4D4D8') };
      }),
      voteYea: next,
      voteNay: next,
      restart: function () { self.setState({ index: 0 }); }
    };
  }
}
</script>
</body>
</html>
